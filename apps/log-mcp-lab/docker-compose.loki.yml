services:
  loki:
    image: grafana/loki:3.2.1
    command: -config.file=/etc/loki/config.yaml
    ports:
      - "3101:3100"
    volumes:
      - ./config/loki/loki.yaml:/etc/loki/config.yaml:ro
      - ./config/loki/rules:/loki/rules/faz1:ro
      - loki_data:/loki
    networks:
      - log_lab

  alloy:
    image: grafana/alloy:v1.5.1
    command: run /etc/alloy/config.alloy --server.http.listen-addr=0.0.0.0:12345
    depends_on:
      - loki
    volumes:
      - ./config/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ./data/generated:/var/log/lab:ro
    networks:
      - log_lab

  alertmanager:
    image: prom/alertmanager:v0.27.0
    command: --config.file=/etc/alertmanager/alertmanager.yml
    ports:
      - "9094:9093"
    volumes:
      - ./config/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    networks:
      - log_lab

  grafana:
    image: grafana/grafana:11.3.0
    depends_on:
      - loki
    ports:
      - "3001:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - log_lab

networks:
  log_lab:
    driver: bridge

volumes:
  loki_data:
  grafana_data:
