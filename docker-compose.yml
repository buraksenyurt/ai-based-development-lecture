services:
  mongodb:
    image: mongo:latest
    container_name: ai-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    networks:
      - ai-app-network
  
  sonarqube:
    image: sonarqube:latest
    container_name: ai-sonarqube
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    ports:
      - "9005:9000"
    networks:
      - ai-app-network

  qdrant:
    image: qdrant/qdrant
    container_name: ai-qdrant
    ports:
      - "6333:6333" # REST API Portu
      - "6334:6334" # GRPC Portu
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: always
    networks:
      - ai-app-network

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    container_name: ai-aspire-dashboard
    restart: always
    ports:
      - "18888:18888" # Dashboard UI Portu
      - "4317:18889"  # OTLP gRPC Portu (VS Code Copilot'un veri göndereceği port)
      - "4318:18890"  # OTLP HTTP Portu
    environment:
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    networks:
      - ai-app-network

networks:
  ai-app-network:
    driver: bridge

volumes:
  mongodb_data:
  qdrant_storage: